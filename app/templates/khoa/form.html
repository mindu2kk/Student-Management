{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit' if obj else 'New' }} Khoa</h2>
<form method="post">
  {% if not obj %}
  <div class="mb-3">
    <label class="form-label">MaKhoa</label>
    <input class="form-control" name="MaKhoa" required>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">TenKhoa</label>
    <input class="form-control" name="TenKhoa" value="{{ obj.TenKhoa if obj }}" required>
  </div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="/khoas">Cancel</a>
 </form>
{% endblock %}
